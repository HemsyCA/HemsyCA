name: Generar sirena de contribuciones

on:
  schedule:
    - cron: "0 0 * * *" # todos los días a medianoche (UTC)
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - tools/mermaid_contrib.py
      - .github/workflows/mermaid.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar SVG de la sirena
        run: python tools/mermaid_contrib.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME_GH: ${{ github.repository_owner }}

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/mermaid-contrib.svg
          git diff --cached --quiet || git commit -m "Actualizar sirena de contribuciones"
          git push
